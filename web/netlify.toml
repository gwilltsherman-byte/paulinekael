# This folder is prebuilt by GitHub Actions (.github/workflows/publish.yml) and
# pushed to the "site" branch; Netlify only needs to publish it.
[build]
  publish = "."
  command = "echo prebuilt"

# Everything the app loads comes from this site, TMDB's image server (posters, logos,
# photos) and YouTube's privacy-friendly player (trailers). Styles are inline in a few
# places (style="..." for bar widths and colours), and the search field's icon is a
# data: image in app.css.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Fonts never change under the same name. The data files below are always requested as
# name?v=<build> (see loadEngine in engine.js), so a build's copy never changes either;
# only data/meta.json, which names the build, has to be checked every time.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/about/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/films.json"
